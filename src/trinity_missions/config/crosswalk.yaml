crosswalk_node:
  ros__parameters:
    detections_topic: /yolopx/detections
    stanley_cmd_topic: /stanley_cmd_vel
    cmd_topic: /crosswalk_cmd_vel          # master relays this in [crosswalk]
    state_topic: /mission/crosswalk/state
    mode_topic: /master/mode

    # 1. pedestrian sign, N frames in a row -> [crosswalk] (interrupts [slow])
    trigger_class: sign_pedestrian
    trigger_conf: 0.5
    trigger_frames: 3
    request_timeout: 1.0                   # s, drop a request the master did not grant
    approach_speed: 0.2                    # m/s while approaching
    approach_timeout: 5.0                  # s without a crosswalk box -> normal (counted from the
                                           # last box seen, or from entering if none yet)

    # 2. stop: crosswalk box BOTTOM EDGE (not size) down to the reference row
    crosswalk_class: crosswalk
    crosswalk_conf: 0.3
    stop_row_ratio: 0.85                   # measure: park at the stop position, read the box
                                           # bottom y, set slightly higher for delay/braking
    stop_frames: 2                         # consecutive frames
    stop_delay_sec: 1.3                    # s, keep approaching this long after the reference row
    box_hold_sec: 0.3                      # s, keep the last box when it flickers out
    image_height: 480                      # px, detection boxes are in yolopx input pixels

    # 3. stop + traffic light (decided on the frames recorded during this stop)
    stop_duration: 4.0                     # s
    light_red_classes: [traffic_light_red, traffic_light_yellow]
    light_green_class: traffic_light_green
    light_conf: 0.4
    light_min_frames: 5                    # fewer light frames -> no traffic light, go
    green_frames: 3                        # red: wait until green this many frames in a row

    # 4. no re-entry while the same crosswalk is still in view
    cooldown: 3.0                          # s after leaving [crosswalk]
